<!-- ── SECCIÓN 4: CONTACTO ── -->
<section class="contact-section" id="contacto" aria-label="Contacto">
    <div class="container">

        <div class="section-header">
            <span class="section-label">// 03</span>
            <h2 class="section-heading">Contacto</h2>
        </div>

        <div class="contact-grid">

            <div class="contact-intro">
                <h3 class="contact-headline">
                    ¿Tienes un proyecto<br>
                    <span class="highlight-orange">en mente?</span>
                </h3>
                <p class="contact-text">
                    Estoy abierto a nuevas oportunidades, colaboraciones freelance
                    y proyectos interesantes. Si tienes una idea, hablemos.
                </p>

                <div class="contact-socials">
                    <h4 class="contact-socials-title">Encuéntrame en</h4>
                    <div class="contact-social-list">
                        <a href="https://linkedin.com/in/brayan-ernesto-loarte-leiva-b75a88375" target="_blank"
                            rel="noopener noreferrer" class="social-card" id="contact-linkedin">
                            <span class="social-card-icon">IN</span>
                            <div>
                                <span class="social-card-name">LinkedIn</span>
                                <span class="social-card-handle">/in/brayan</span>
                            </div>
                            <span class="social-card-arrow">↗</span>
                        </a>
                        <a href="mailto:loarteleivabrayan@gmail.com" class="social-card" id="contact-email">
                            <span class="social-card-icon">@</span>
                            <div>
                                <span class="social-card-name">Email</span>
                                <span class="social-card-handle">loarteleivabrayan@gmail.com</span>
                            </div>
                            <span class="social-card-arrow">↗</span>
                        </a>
                        <a href="tel:+51916598466" class="social-card" id="contact-phone">
                            <span class="social-card-icon">TL</span>
                            <div>
                                <span class="social-card-name">Teléfono</span>
                                <span class="social-card-handle">+51 916 598 466</span>
                            </div>
                            <span class="social-card-arrow">↗</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="contact-form-wrap">
                <!-- ¡IMPORTANTE!: Reemplaza TU_ID_AQUI con el ID que te da Formspree (https://formspree.io/) al crear un formulario -->
                <form class="contact-form" id="contact-form" action="https://formspree.io/f/xpparbwl" method="POST"
                    novalidate>
                    <div class="form-group">
                        <label for="contact-name" class="form-label">Nombre</label>
                        <input type="text" id="contact-name" name="name" class="form-input"
                            placeholder="Tu nombre completo" required autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="contact-email-input" class="form-label">Email</label>
                        <input type="email" id="contact-email-input" name="email" class="form-input"
                            placeholder="tu@email.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="contact-subject" class="form-label">Asunto</label>
                        <input type="text" id="contact-subject" name="subject" class="form-input"
                            placeholder="¿De qué quieres hablar?">
                    </div>

                    <div class="form-group">
                        <label for="contact-message" class="form-label">Mensaje</label>
                        <textarea id="contact-message" name="message" class="form-input form-textarea"
                            placeholder="Cuéntame los detalles de tu proyecto..." rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="contact-submit">
                        Enviar mensaje
                        <span class="icon" aria-hidden="true">→</span>
                    </button>

                    <div class="form-status" id="form-status" aria-live="polite" hidden>
                        <p class="form-status-text" id="form-status-text"></p>
                    </div>
                </form>
            </div>

        </div>

    </div>
</section>
